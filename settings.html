<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Settings · Quero</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet"
    />

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background: #FAF8F2;
            color: #23211D;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            margin: 0;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* ── No blue tap highlight on Android / iOS ── */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Selection (warm sand, no blue) ── */
        ::selection {
            background: rgba(168, 115, 58, 0.18);
            color: inherit;
        }
        ::-moz-selection {
            background: rgba(168, 115, 58, 0.18);
            color: inherit;
        }

        .settings-card {
            max-width: 560px;
            width: 100%;
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 1px 2px rgba(35, 33, 29, 0.03), 0 4px 16px rgba(35, 33, 29, 0.05);
            padding: 32px 28px 28px;
            transition: box-shadow 0.25s ease;
        }

        .settings-card:hover {
            box-shadow: 0 8px 26px rgba(35, 33, 29, 0.08);
        }

        /* ── iOS‑style back button ── */
        .settings-header {
            margin-bottom: 28px;
            padding-bottom: 16px;
            border-bottom: 1px solid #E5DED2;
        }

        .back-control {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
            color: #6F685E;
            font-family: 'Lexend', sans-serif;
            font-size: 16px;
            font-weight: 500;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .back-control:hover {
            color: #23211D;
            background: rgba(168, 115, 58, 0.06);
        }

        .back-control:focus-visible {
            outline: 2px solid #A8733A;
            outline-offset: 1px;
        }

        .back-control svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2.5;
            fill: none;
        }

        .settings-header .subtitle {
            font-size: 14px;
            font-weight: 400;
            color: #6F685E;
            margin-top: 6px;
            padding-left: 2px;
        }

        .settings-group {
            margin-bottom: 28px;
        }

        .settings-group:last-of-type {
            margin-bottom: 0;
        }

        .settings-group-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #978F84;
            margin-bottom: 10px;
            padding-left: 2px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            border-radius: 12px;
            background: #FFFFFF;
            border: 1px solid rgba(168, 115, 58, 0.08);
            transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            cursor: default;
        }

        .setting-item:not(:last-child) {
            margin-bottom: 6px;
        }

        .setting-item:hover {
            background: #F4EFE5;
            border-color: rgba(168, 115, 58, 0.14);
            box-shadow: 0 1px 3px rgba(35, 33, 29, 0.04);
        }

        .setting-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .icon-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(168, 115, 58, 0.08);
            color: #A8733A;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .setting-item:hover .icon-wrap {
            background: rgba(168, 115, 58, 0.14);
        }

        .icon-wrap svg {
            width: 18px;
            height: 18px;
            stroke-width: 1.8;
            fill: none;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .setting-item-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .setting-item-info .title {
            font-size: 14px;
            font-weight: 500;
            color: #23211D;
        }

        .setting-item-info .desc {
            font-size: 12px;
            color: #6F685E;
            line-height: 1.4;
        }

        .setting-item.clickable {
            cursor: pointer;
            user-select: none;
        }

        .setting-item.clickable:active {
            transform: scale(0.995);
            transition: transform 0.1s ease;
        }

        .chevron-wrap {
            display: flex;
            align-items: center;
            color: #978F84;
            flex-shrink: 0;
            margin-left: 8px;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        .setting-item.clickable:hover .chevron-wrap {
            color: #6F685E;
            transform: translateX(2px);
        }

        .chevron-wrap svg {
            width: 16px;
            height: 16px;
            stroke-width: 2;
            fill: none;
            stroke: currentColor;
        }

        .danger-zone {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #E5DED2;
        }

        .danger-zone .settings-group-label {
            color: #C27A7A;
        }

        .danger-zone .setting-item {
            border-color: #F0D6D6;
            background: #FDF2F2;
        }

        .danger-zone .setting-item:hover {
            background: #FDE8E8;
            border-color: #EAC4C4;
        }

        .danger-zone .icon-wrap {
            background: rgba(179, 58, 58, 0.10);
            color: #B33A3A;
        }

        .danger-zone .setting-item:hover .icon-wrap {
            background: rgba(179, 58, 58, 0.16);
        }

        .danger-zone .setting-item .title {
            color: #B33A3A;
        }

        .danger-zone .setting-item .desc {
            color: #C27A7A;
        }

        .danger-zone .chevron-wrap {
            color: #C27A7A;
        }

        .danger-zone .setting-item.clickable:hover .chevron-wrap {
            color: #B33A3A;
        }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(35, 33, 29, 0.40);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #FFFFFF;
            border-radius: 20px;
            max-width: 420px;
            width: 100%;
            padding: 28px 28px 24px;
            box-shadow: 0 12px 48px rgba(35, 33, 29, 0.18);
            transform: translateY(12px) scale(0.98);
            transition: transform 0.25s ease, opacity 0.25s ease;
            opacity: 0;
        }

        .modal-overlay.open .modal {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        .modal-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            border-radius: 12px;
            margin-bottom: 16px;
            background: rgba(168, 115, 58, 0.08);
            color: #A8733A;
        }

        .modal-icon.danger {
            background: rgba(179, 58, 58, 0.10);
            color: #B33A3A;
        }

        .modal-icon svg {
            width: 24px;
            height: 24px;
            stroke-width: 1.8;
            fill: none;
            stroke: currentColor;
        }

        .modal h2 {
            font-size: 18px;
            font-weight: 600;
            color: #23211D;
            margin-bottom: 6px;
        }

        .modal p {
            font-size: 14px;
            color: #6F685E;
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .modal .modal-sub {
            font-size: 13px;
            color: #978F84;
            margin-top: 2px;
        }

        .modal-destructive-list {
            margin: 12px 0 16px;
            padding-left: 20px;
            font-size: 14px;
            color: #6F685E;
            line-height: 1.7;
        }

        .modal-destructive-list li::marker {
            color: #C27A7A;
        }

        /* Type DELETE input */
        .type-delete-input {
            margin: 8px 0 12px;
        }

        .type-delete-input input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #E5DED2;
            background: #F4EFE5;
            font-size: 14px;
            font-family: 'Lexend', sans-serif;
            color: #23211D;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .type-delete-input input:focus {
            border-color: #A8733A;
            box-shadow: 0 0 0 3px rgba(168, 115, 58, 0.10);
        }

        .type-delete-input input::placeholder {
            color: #978F84;
        }

        /* ── iOS slider (disabled state) ── */
        .slider-container {
            margin: 20px 0 12px;
            width: 100%;
            transition: opacity 0.2s;
        }

        .slider-container.disabled {
            opacity: 0.4;
            pointer-events: none;
        }

        .slider-track {
            position: relative;
            width: 100%;
            height: 48px;
            background: #F4EFE5;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(168, 115, 58, 0.15);
            transition: background 0.2s;
            cursor: pointer;
        }

        .slider-track.active {
            background: #FDE8E8;
            border-color: #EAC4C4;
        }

        .slider-label {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 500;
            color: #978F84;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .slider-handle {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1), 0 1px 2px rgba(0,0,0,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            transition: box-shadow 0.15s, background 0.15s;
            touch-action: none;
            z-index: 2;
        }

        .slider-handle:active {
            cursor: grabbing;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .slider-handle svg {
            width: 18px;
            height: 18px;
            stroke: #B33A3A;
            stroke-width: 2;
            fill: none;
            pointer-events: none;
        }

        .slider-handle.loading {
            pointer-events: none;
            background: #FDE8E8;
        }

        .slider-handle .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: #B33A3A;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .slider-handle.loading .spinner {
            display: block;
        }
        .slider-handle.loading svg.chevron-icon {
            display: none;
        }
        .slider-handle.success svg.chevron-icon {
            display: none;
        }
        .slider-handle.success .spinner {
            display: none;
        }
        .slider-handle .check-icon {
            display: none;
            width: 20px;
            height: 20px;
            color: #A8733A;
            stroke-width: 2.5;
        }
        .slider-handle.success .check-icon {
            display: block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Track fill (muted red) */
        .slider-track-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0;
            background: rgba(179, 58, 58, 0.12);
            border-radius: 24px;
            transition: width 0.15s ease;
        }

        .error-msg {
            font-size: 13px;
            color: #B33A3A;
            margin-top: 8px;
            display: none;
            align-items: center;
            gap: 6px;
        }

        .error-msg.show {
            display: flex;
        }

        .error-msg svg {
            width: 14px;
            height: 14px;
            stroke: #B33A3A;
            stroke-width: 2;
            fill: none;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: flex-end;
            align-items: center;
        }

        .btn-subtle {
            background: none;
            border: none;
            color: #6F685E;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            transition: color 0.15s, background 0.15s;
        }

        .btn-subtle:hover {
            color: #23211D;
            background: rgba(0,0,0,0.04);
        }

        .setting-item.clickable:focus-visible {
            outline: 2px solid #A8733A;
            outline-offset: 1px;
            border-radius: 12px;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
                align-items: flex-start;
                padding-top: 24px;
            }
            .settings-card {
                padding: 20px 16px 20px;
                border-radius: 16px;
            }
            .back-control {
                font-size: 15px;
            }
            .setting-item {
                padding: 10px 12px;
                flex-wrap: wrap;
                gap: 6px;
            }
            .icon-wrap {
                width: 28px;
                height: 28px;
            }
            .icon-wrap svg {
                width: 16px;
                height: 16px;
            }
            .modal {
                padding: 20px;
                margin: 12px;
            }
            .modal-actions {
                flex-direction: column-reverse;
                align-items: stretch;
            }
            .btn-subtle {
                width: 100%;
                text-align: center;
                padding: 10px;
            }
            .settings-card:hover {
                box-shadow: 0 1px 2px rgba(35, 33, 29, 0.03), 0 4px 16px rgba(35, 33, 29, 0.05);
            }
        }
    </style>
</head>
<body>
    <div class="settings-card" role="main" aria-label="Settings">
        <!-- Header: iOS‑style back button -->
        <div class="settings-header">
            <button class="back-control" id="back-button" aria-label="Back to app">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Settings
            </button>
            <div class="subtitle">Preferences for your Quero account.</div>
        </div>

        <!-- Community -->
        <div class="settings-group">
            <div class="settings-group-label">Community</div>
            <div class="setting-item clickable" id="contribute-btn" role="button" tabindex="0">
                <div class="setting-item-left">
                    <span class="icon-wrap">
                        <svg viewBox="0 0 24 24"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg>
                    </span>
                    <div class="setting-item-info">
                        <span class="title">Contribute</span>
                        <span class="desc">Help improve Quero on GitHub.</span>
                    </div>
                </div>
                <span class="chevron-wrap">
                    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                </span>
            </div>
        </div>

        <!-- Legal -->
        <div class="settings-group">
            <div class="settings-group-label">Legal</div>
            <div class="setting-item clickable" id="tos-btn" role="button" tabindex="0">
                <div class="setting-item-left">
                    <span class="icon-wrap">
                        <svg viewBox="0 0 24 24"><path d="M8 21h12a2 2 0 0 0 2-2v-2H10v2a2 2 0 1 1-4 0V5a2 2 0 1 0-4 0v3h4"/><path d="M19 17V5a2 2 0 0 0-2-2H4"/><path d="M15 8h-5"/><path d="M15 12h-5"/></svg>
                    </span>
                    <div class="setting-item-info">
                        <span class="title">Terms of Service</span>
                        <span class="desc">Privacy, data handling and legal information.</span>
                    </div>
                </div>
                <span class="chevron-wrap">
                    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                </span>
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="danger-zone">
            <div class="settings-group-label">Danger Zone</div>
            <div class="setting-item clickable" id="logout-btn" role="button" tabindex="0">
                <div class="setting-item-left">
                    <span class="icon-wrap">
                        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </span>
                    <div class="setting-item-info">
                        <span class="title">Log Out</span>
                        <span class="desc">Sign out from this device.</span>
                    </div>
                </div>
                <span class="chevron-wrap">
                    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                </span>
            </div>
            <div class="setting-item clickable" id="delete-btn" role="button" tabindex="0">
                <div class="setting-item-left">
                    <span class="icon-wrap">
                        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    </span>
                    <div class="setting-item-info">
                        <span class="title">Delete Account</span>
                        <span class="desc">Delete your account, conversations, and synced preferences forever.</span>
                    </div>
                </div>
                <span class="chevron-wrap">
                    <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                </span>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-label="Dialog">
        <div class="modal" id="modal-content">
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('modal-overlay');
        const modalBody = document.getElementById('modal-body');
        const backBtn = document.getElementById('back-button');
        const contributeBtn = document.getElementById('contribute-btn');
        const tosBtn = document.getElementById('tos-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const deleteBtn = document.getElementById('delete-btn');

        // ── Back navigation ──
        backBtn.addEventListener('click', () => window.location.href = '/app.html');

        // ── Modal system ──
        let activeModal = null;

        function openModal(html, type) {
            if (activeModal) { activeModal.resolve(null); activeModal = null; }
            modalBody.innerHTML = html;
            overlay.classList.add('open');
            activeModal = { resolve: null, type };
            return new Promise((resolve) => {
                activeModal.resolve = resolve;
                const cancelBtn = document.getElementById('modal-cancel');
                if (cancelBtn) cancelBtn.addEventListener('click', () => closeModal(false));
            });
        }

        function closeModal(result) {
            overlay.classList.remove('open');
            if (activeModal) { activeModal.resolve(result); activeModal = null; }
            document.activeElement?.blur();
        }

        overlay.addEventListener('click', (e) => {
            if (e.target === overlay && activeModal && activeModal.type !== 'delete') closeModal(false);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('open') && activeModal && activeModal.type !== 'delete') closeModal(false);
        });

        // ── Logout modal ──
        function buildLogoutModal() {
            return `
                <div class="modal-icon">
                    <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                </div>
                <h2>Log out?</h2>
                <p>You will be signed out from this device. You can sign in again anytime.</p>
                <div class="modal-actions">
                    <button class="btn-subtle" id="modal-cancel">Cancel</button>
                    <button class="btn btn-primary" id="modal-confirm">Log Out</button>
                </div>`;
        }

        // ── Delete modal (two‑step: type DELETE, then slide) ──
        function buildDeleteModal() {
            return `
                <div class="modal-icon danger">
                    <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                </div>
                <h2>Delete Account</h2>
                <p>This permanently removes:</p>
                <ul class="modal-destructive-list">
                    <li>Clerk account</li>
                    <li>Supabase conversations</li>
                    <li>Preferences &amp; settings</li>
                    <li>Synced data</li>
                </ul>
                <p class="modal-sub">Uploaded files are temporary and are already discarded after processing.</p>
                <div class="type-delete-input">
                    <input type="text" id="delete-input" placeholder="Type DELETE" autocomplete="off" spellcheck="false" />
                </div>
                <div class="slider-container disabled" id="slider-container">
                    <div class="slider-track" id="slider-track">
                        <div class="slider-track-fill" id="slider-fill"></div>
                        <div class="slider-label" id="slider-label">Type DELETE first</div>
                        <div class="slider-handle" id="slider-handle">
                            <svg class="chevron-icon" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
                            <div class="spinner"></div>
                            <svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="20 6 9 17 4 12"/></svg>
                        </div>
                    </div>
                </div>
                <div class="error-msg" id="delete-error">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span id="delete-error-text"></span>
                </div>
                <div class="modal-actions">
                    <button class="btn-subtle" id="modal-cancel">Cancel</button>
                </div>`;
        }

        function bindDeleteControls() {
            const input = document.getElementById('delete-input');
            const container = document.getElementById('slider-container');
            const label = document.getElementById('slider-label');
            const track = document.getElementById('slider-track');
            const handle = document.getElementById('slider-handle');
            const fill = document.getElementById('slider-fill');
            const errorEl = document.getElementById('delete-error');
            const errorText = document.getElementById('delete-error-text');
            if (!input || !container) return;

            let sliderEnabled = false;
            let deleteTriggered = false;
            let dragging = false;

            function enableSlider() {
                sliderEnabled = true;
                container.classList.remove('disabled');
                label.textContent = 'Slide to delete';
                label.style.opacity = '1';
            }

            function disableSlider() {
                sliderEnabled = false;
                container.classList.add('disabled');
                label.textContent = 'Type DELETE first';
                label.style.opacity = '1';
                handle.style.left = '4px';
                fill.style.width = '0';
                track.classList.remove('active');
                handle.classList.remove('loading', 'success');
                deleteTriggered = false;
            }

            function checkInput() {
                const val = input.value.trim();
                if (val === 'DELETE') {
                    if (!sliderEnabled && !deleteTriggered) enableSlider();
                } else {
                    if (sliderEnabled) disableSlider();
                }
            }

            input.addEventListener('input', checkInput);

            const maxLeft = () => track.offsetWidth - handle.offsetWidth - 4;

            function updatePosition(clientX) {
                if (!sliderEnabled || deleteTriggered || handle.classList.contains('loading')) return;
                const rect = track.getBoundingClientRect();
                let dx = clientX - rect.left - handle.offsetWidth/2;
                dx = Math.max(4, Math.min(dx, maxLeft()));
                handle.style.left = dx + 'px';
                const progress = dx / maxLeft();
                fill.style.width = (progress * 100) + '%';
                label.style.opacity = 1 - progress;
                if (progress > 0.05) track.classList.add('active');
                else track.classList.remove('active');
                if (progress >= 0.95 && !deleteTriggered) {
                    deleteTriggered = true;
                    performDelete();
                }
            }

            function performDelete() {
                handle.classList.add('loading');
                handle.style.left = maxLeft() + 'px';
                fill.style.width = '100%';
                label.textContent = 'Deleting account…';
                label.style.opacity = '1';
                track.classList.add('active');
                if (errorEl) errorEl.classList.remove('show');

                fetch('/api/delete-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                })
                .then(res => {
                    if (res.ok) {
                        // Success feedback
                        handle.classList.remove('loading');
                        handle.classList.add('success');
                        label.textContent = '✓ Deleted';
                        fill.style.width = '100%';
                        setTimeout(() => {
                            closeModal(true);
                            window.location.href = '/';
                        }, 800);
                    } else {
                        return res.json().then(data => { throw new Error(data.error || 'Something went wrong.'); });
                    }
                })
                .catch(err => {
                    if (errorEl && errorText) {
                        errorText.textContent = err.message;
                        errorEl.classList.add('show');
                    }
                    // Reset slider
                    handle.classList.remove('loading', 'success');
                    handle.style.left = '4px';
                    fill.style.width = '0';
                    label.textContent = sliderEnabled ? 'Slide to delete' : 'Type DELETE first';
                    label.style.opacity = '1';
                    track.classList.remove('active');
                    deleteTriggered = false;
                });
            }

            // Pointer events
            function onPointerDown(e) {
                if (!sliderEnabled || deleteTriggered || handle.classList.contains('loading')) return;
                e.preventDefault();
                dragging = true;
                handle.setPointerCapture(e.pointerId);
            }

            function onPointerMove(e) {
                if (!dragging || !sliderEnabled || deleteTriggered || handle.classList.contains('loading')) return;
                updatePosition(e.clientX);
            }

            function onPointerUp(e) {
                if (!dragging) return;
                dragging = false;
                if (!deleteTriggered) {
                    handle.style.left = '4px';
                    fill.style.width = '0';
                    label.style.opacity = '1';
                    track.classList.remove('active');
                }
            }

            handle.addEventListener('pointerdown', onPointerDown);
            handle.addEventListener('pointermove', onPointerMove);
            handle.addEventListener('pointerup', onPointerUp);
            handle.addEventListener('pointercancel', onPointerUp);

            track.addEventListener('pointerdown', (e) => {
                if (e.target === track && sliderEnabled && !deleteTriggered && !handle.classList.contains('loading')) {
                    const rect = track.getBoundingClientRect();
                    const dx = e.clientX - rect.left - handle.offsetWidth/2;
                    handle.style.left = Math.max(4, Math.min(dx, maxLeft())) + 'px';
                    onPointerDown(e);
                }
            });

            window.addEventListener('resize', () => {
                if (!deleteTriggered && !handle.classList.contains('loading')) {
                    handle.style.left = '4px';
                    fill.style.width = '0';
                }
            });

            checkInput();
        }

        async function showLogoutModal() {
            await openModal(buildLogoutModal(), 'logout');
            const confirmBtn = document.getElementById('modal-confirm');
            if (confirmBtn) {
                confirmBtn.addEventListener('click', () => {
                    closeModal(true);
                    window.location.href = '/';
                });
            }
            return new Promise(resolve => {
                const orig = closeModal;
                closeModal = (val) => { orig(val); resolve(val); closeModal = orig; };
            });
        }

        async function showDeleteModal() {
    openModal(buildDeleteModal(), 'delete');
    bindDeleteControls();

    return new Promise(resolve => {
        const orig = closeModal;
        closeModal = (val) => {
            orig(val);
            resolve(val);
            closeModal = orig;
        };
    });
        }

        function makeAccessible(el, handler) {
            el.addEventListener('click', handler);
            el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); }
            });
        }

        makeAccessible(contributeBtn, () => window.open('https://github.com/aceyash-dev/Quero', '_blank'));
        makeAccessible(tosBtn, () => window.location.href = '/terms.html');
        makeAccessible(logoutBtn, async () => await showLogoutModal());
        makeAccessible(deleteBtn, async () => await showDeleteModal());
    </script>
</body>
