<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Quero — Profile & Settings</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">

    <script
  crossorigin="anonymous"
  src="https://unpkg.com/@clerk/clerk-js@latest/dist/clerk.browser.js"
  data-clerk-publishable-key="pk_live_Y2xlcmsucXVlcm8uaW5kZXZzLmluJA">
</script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --sand-bg: #F5F0E8;
            --card-bg: #FAF8F4;
            --border: #E0D5C5;
            --text-primary: #3D2B1F;
            --text-secondary: #7D6A58;
            --bronze: #B8860B;
            --bronze-hover: #A07608;
            --radius: 12px;
            --shadow: 0 1px 3px rgba(61,43,31,0.04);
            --font-display: 'Playfair Display', serif;
            --font-body: Georgia, 'Times New Roman', serif;
            --font-ui: 'Lexend', sans-serif;
        }

        /* Remove default tap highlight on Android & touch devices, replace with bronze */
        * {
            -webkit-tap-highlight-color: rgba(184,134,11,0.15);
        }
        button, a, input, textarea, select, img {
            -webkit-tap-highlight-color: rgba(184,134,11,0.15);
        }

        /* Selection color */
        ::selection {
            background: #E8D8B8;
            color: #3D2B1F;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { font-size: 16px; -webkit-font-smoothing: antialiased; }
        body {
            font-family: var(--font-body);
            background: var(--sand-bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Skeleton loading screen */
        .skeleton {
            position: relative;
            overflow: hidden;
            background: #e7dfd4;
            border-radius: 8px;
        }
        .skeleton::after {
            content: "";
            position: absolute;
            inset: 0;
            transform: translateX(-100%);
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
            animation: shimmer 1.2s infinite;
        }
        @keyframes shimmer {
            100% { transform: translateX(100%); }
        }
        .loading-screen {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 40px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 24px 16px 40px;
            display: none; /* hidden until loaded */
        }

        /* Nav */
        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
        }
        .nav__back {
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 1.1rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }
        .nav__back:hover { color: var(--text-primary); }
        .nav__title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.2;
        }

        /* Profile Preview */
        .profile-preview {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: var(--shadow);
        }
        .profile-preview__banner {
            height: 160px;
            background: #e0d5c5 url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40"><circle cx="20" cy="20" r="2" fill="%23c4b49e" opacity="0.3"/><circle cx="80" cy="15" r="3" fill="%23c4b49e" opacity="0.2"/><circle cx="150" cy="25" r="4" fill="%23c4b49e" opacity="0.1"/></svg>') repeat;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .profile-preview__banner img { width: 100%; height: 100%; object-fit: cover; }
        .profile-preview__banner-overlay {
            position: absolute; inset: 0; background: rgba(61,43,31,0);
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s; opacity: 0;
        }
        .profile-preview__banner:hover .profile-preview__banner-overlay { background: rgba(61,43,31,0.25); opacity: 1; }
        .profile-preview__banner-overlay span {
            background: white; padding: 6px 14px; border-radius: 6px;
            font-family: var(--font-ui); font-weight: 500; font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .profile-preview__avatar-wrapper {
            margin-top: -48px;
            margin-left: 24px;
            position: relative;
            z-index: 2;
        }
        .profile-preview__avatar {
            width: 96px; height: 96px;
            border-radius: 50%;
            border: 4px solid var(--card-bg);
            background: #d4c5b2;
            object-fit: cover;
            display: block;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(61,43,31,0.1);
        }
        .profile-preview__info {
            padding: 20px 24px 24px;
        }
        .profile-preview__name {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex; align-items: center; gap: 8px;
        }
        .profile-preview__verified {
            width: 22px; height: 22px;
            background: var(--bronze);
            color: white;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem;
        }
        .profile-preview__username {
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .profile-preview__bio {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-primary);
            margin-top: 12px;
            line-height: 1.6;
        }
        .profile-preview__meta {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 14px;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .profile-preview__meta-item { display: flex; align-items: center; gap: 6px; }
        .profile-preview__meta-item svg { width: 14px; height: 14px; color: var(--bronze); }
        .profile-preview__meta-item a {
            color: var(--text-primary);
            text-decoration: none;
        }
        .profile-preview__meta-item a:hover, .profile-preview__meta-item a:active {
            color: var(--bronze);
        }
        .profile-preview__meta-item a:visited {
            color: var(--text-primary);
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }
        .card__header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .card__title {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        .card__action {
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--bronze);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .card__action:hover { background: rgba(184,134,11,0.08); }

        .profile-field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 20px;
        }
        .profile-field__label {
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .profile-field__value {
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-primary);
        }
        .profile-field__input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1rem;
            background: white;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }
        .profile-field__input:focus { border-color: var(--bronze); }
        textarea.profile-field__input { min-height: 80px; resize: vertical; }

        .edit-buttons {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        /* Settings rows */
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: background 0.1s;
        }
        .settings-row:last-child { border-bottom: none; }
        .settings-row:hover { background: rgba(0,0,0,0.01); }
        .settings-row__left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: var(--font-ui);
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-primary);
        }
        .settings-row__left svg { width: 20px; height: 20px; color: var(--text-secondary); }
        .settings-row__arrow { font-size: 1.2rem; color: var(--text-secondary); }

        /* Buttons */
        .btn {
            font-family: var(--font-ui);
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn--primary { background: var(--bronze); color: white; }
        .btn--primary:hover { background: var(--bronze-hover); }
        .btn--ghost { background: none; color: var(--text-secondary); }
        .btn--ghost:hover { background: rgba(0,0,0,0.04); }

        /* Dialogs */
        .dialog-overlay {
            position: fixed; inset: 0; background: rgba(42,29,20,0.55);
            z-index: 1000; display: flex; align-items: center; justify-content: center;
            padding: 16px;
        }
        .dialog {
            background: var(--card-bg); border-radius: 16px; border: 1px solid var(--border);
            width: 100%; max-width: 440px; box-shadow: 0 20px 48px rgba(61,43,31,0.11);
            animation: slideUp 0.2s ease;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .dialog__header { display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0; }
        .dialog__title { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
        .dialog__close { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border); background: none; cursor: pointer; font-size: 1.2rem; }
        .dialog__body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .dialog__footer { padding: 0 20px 20px; display: flex; gap: 10px; justify-content: flex-end; }

        .hidden { display: none !important; }
        .sr-only { position: absolute; width: 1px; height: 1px; clip: rect(0,0,0,0); overflow: hidden; }

        @media (max-width: 480px) {
            .container, .loading-screen { padding: 16px 12px; }
            .profile-preview__avatar { width: 72px; height: 72px; }
            .profile-preview__name { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- Skeleton loading screen -->
<div id="loadingScreen" class="loading-screen">
    <div class="profile-preview">
        <div class="skeleton" style="height:160px;"></div>
        <div style="padding:24px">
            <div class="skeleton" style="width:88px;height:88px;border-radius:50%;margin-top:-60px;"></div>
            <div class="skeleton" style="width:220px;height:34px;margin-top:20px;"></div>
            <div class="skeleton" style="width:140px;height:18px;margin-top:12px;"></div>
            <div class="skeleton" style="width:100%;height:16px;margin-top:24px;"></div>
            <div class="skeleton" style="width:70%;height:16px;margin-top:12px;"></div>
        </div>
    </div>
</div>

<!-- Main content (hidden until loaded) -->
<div class="container" id="mainContent">
    <!-- Navigation -->
    <div class="nav">
        <button class="nav__back" onclick="history.back()">← Settings</button>
        <h1 class="nav__title">Profile</h1>
    </div>

    <!-- Profile Preview (static, always visible) -->
    <div class="profile-preview" id="profilePreview">

        <div class="profile-preview__avatar-wrapper">

            <div class="profile-preview__name" id="profileNameDisplay"></div>
            <div class="profile-preview__username" id="profileUsernameDisplay"></div>
            <div class="profile-preview__bio" id="profileBioDisplay"></div>
            <div class="profile-preview__meta">
                <span class="profile-preview__meta-item"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M2 8h12M8 1a10 10 0 010 14" stroke="currentColor" stroke-width="1.2"/></svg><a href="#" id="profileWebsiteDisplay" target="_blank"></a></span>
                <span class="profile-preview__meta-item"><svg viewBox="0 0 16 16"><path d="M8 1a3.5 3.5 0 00-3.5 3.5c0 2.5 3.5 7 3.5 7s3.5-4.5 3.5-7A3.5 3.5 0 008 1zm0 5a1.5 1.5 0 110-3 1.5 1.5 0 010 3z" fill="currentColor"/></svg><span id="profileLocationDisplay"></span></span>
                <span class="profile-preview__meta-item" id="profileJoinedDisplay"></span>

        </div>
    </div>

    <!-- Profile Card (editable fields) -->
    <div class="card" id="profileCard">
        <div class="card__header">
            <h2 class="card__title">Profile</h2>
            <button class="card__action" id="editProfileBtn">Edit</button>
        </div>
        <div id="profileReadView">
            <div class="profile-field"><span class="profile-field__label">Display Name</span><span class="profile-field__value" id="displayNameRead"></span></div>
            <div class="profile-field"><span class="profile-field__label">Bio</span><span class="profile-field__value" id="bioRead"></span></div>
            <div class="profile-field"><span class="profile-field__label">Website</span><span class="profile-field__value" id="websiteRead"></span></div>
            <div class="profile-field"><span class="profile-field__label">Location</span><span class="profile-field__value" id="locationRead"></span></div>
        </div>
        <div id="profileEditView" class="hidden">

            <div class="profile-field"><label class="profile-field__label" for="editBio">Bio</label><textarea class="profile-field__input" id="editBio"></textarea></div>
            <div class="profile-field"><label class="profile-field__label" for="editWebsite">Website</label><input class="profile-field__input" id="editWebsite"></div>
            <div class="profile-field"><label class="profile-field__label" for="editLocation">Location</label><input class="profile-field__input" id="editLocation"></div>
            <div class="edit-buttons">
                <button class="btn btn--ghost" id="cancelEditBtn">Cancel</button>
                <button class="btn btn--primary" id="saveProfileBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Account Card -->
    <div class="card">
        <div class="card__header"><h2 class="card__title">Account</h2></div>
        <div class="settings-row" id="rowUsername">
            <div class="settings-row__left"><svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a4 4 0 100 8 4 4 0 000-8zM4 14a6 6 0 0112 0v1H4v-1z"/></svg> Username <span style="margin-left:6px; color:var(--text-secondary);" id="accountUsername"></span></div>

<div class="dialog-overlay hidden" id="avatarDialog">

            <button class="btn btn--primary" id="uploadAvatarBtn">Upload</button>
        </div>
    </div>
</div>

        const banner = document.getElementById('profileBanner');
        if (p.banner_url) {
            banner.innerHTML = `<img src="${escapeHTML(p.banner_url)}" alt="Banner"><div class="profile-preview__banner-overlay"><span>Change Banner</span></div>`;
        } else {
            banner.innerHTML = '<div class="profile-preview__banner-overlay"><span>Add Banner</span></div>';
        }

        // Avatar
        document.getElementById('profileAvatar').src = u.imageUrl || '';

        // Name + verified
        const nameEl = document.getElementById('profileNameDisplay');
        nameEl.innerHTML = `${escapeHTML(p.display_name || u.fullName)} ${p.verified ? '<span class="profile-preview__verified">✓</span>' : ''}`;

        // Username
        document.getElementById('profileUsernameDisplay').textContent = u.username ? `@${u.username}` : '';

        // Bio
        document.getElementById('profileBioDisplay').textContent = p.bio || '';

        // Website
        const webLink = document.getElementById('profileWebsiteDisplay');
        webLink.textContent = p.website ? p.website.replace(/^https?:\/\//, '') : '';
        webLink.href = p.website || '#';

        // Location
        document.getElementById('profileLocationDisplay').textContent = p.location || '';

        // Joined date
        const joined = document.getElementById('profileJoinedDisplay');
        if (u.createdAt) {
            joined.textContent = `Joined ${new Date(u.createdAt).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}`;
        } else {
            joined.textContent = '';
        }

        // Profile read view
        document.getElementById('displayNameRead').textContent = p.display_name || '';
        document.getElementById('bioRead').textContent = p.bio || '';
        document.getElementById('websiteRead').textContent = p.website || '';
        document.getElementById('locationRead').textContent = p.location || '';

        // Account card info
        document.getElementById('accountUsername').textContent = u.username ? `@${u.username}` : '';
        document.getElementById('accountEmail').textContent = u.primaryEmailAddress?.emailAddress || '';
        document.getElementById('currentEmailText').textContent = u.primaryEmailAddress?.emailAddress || '';
    }

    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // --------------- REAL INIT ---------------
    console.log(window.Clerk);
  async function initialize() {
    while (!window.Clerk) {
        await new Promise(resolve => setTimeout(resolve, 50));
    }

    await window.Clerk.load();
        clerkUser = window.Clerk.user;
        if (!clerkUser) {
            window.location.href = '/sign-in';
            return;
        }

        // 2. Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        window.supabaseClient = supabase;

        // 3. Load / create profile
        const { data, error } = await supabase
            .from('profiles')
            .select('id, display_name, bio, website, location, banner_url, verified')
            .eq('id', clerkUser.id)
            .single();

        if (error && error.code !== 'PGRST116') {
            console.error('Error loading profile:', error);
            return;
        }

        if (!data) {
            // Auto-create profile from Clerk data
            const defaultProfile = {
                id: clerkUser.id,
                display_name: clerkUser.fullName || '',
                bio: '',
                website: '',
                location: '',
                banner_url: null,
                verified: false,
            };
            const { error: insertError } = await supabase
                .from('profiles')
                .insert(defaultProfile);
            if (!insertError) {
                supabaseProfile = defaultProfile;
            } else {
                console.error('Failed to create profile:', insertError);
                supabaseProfile = {};
            }
        } else {
            supabaseProfile = data;
        }

        // Hide skeleton, show page
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';

        renderAll();
    }

    // --------------- EDIT PROFILE LOGIC ---------------
    document.getElementById('editProfileBtn').addEventListener('click', () => {
        document.getElementById('profileReadView').classList.add('hidden');
        document.getElementById('profileEditView').classList.remove('hidden');
        document.getElementById('editProfileBtn').style.display = 'none';
        document.getElementById('editDisplayName').value = supabaseProfile.display_name || '';
        document.getElementById('editBio').value = supabaseProfile.bio || '';
        document.getElementById('editWebsite').value = supabaseProfile.website || '';
        document.getElementById('editLocation').value = supabaseProfile.location || '';
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
        document.getElementById('profileReadView').classList.remove('hidden');
        document.getElementById('profileEditView').classList.add('hidden');
        document.getElementById('editProfileBtn').style.display = '';
    });

    document.getElementById('saveProfileBtn').addEventListener('click', async () => {
        const newData = {
            display_name: document.getElementById('editDisplayName').value.trim(),
            bio: document.getElementById('editBio').value.trim(),
            website: document.getElementById('editWebsite').value.trim(),
            location: document.getElementById('editLocation').value.trim(),
        };
        const { error } = await window.supabaseClient
            .from('profiles')
            .update(newData)
            .eq('id', clerkUser.id);
        if (!error) {
            Object.assign(supabaseProfile, newData);
            renderAll();
            document.getElementById('profileReadView').classList.remove('hidden');
            document.getElementById('profileEditView').classList.add('hidden');
            document.getElementById('editProfileBtn').style.display = '';
        } else {
            alert('Failed to update profile: ' + error.message);
        }
    });

    // --------------- ACCOUNT ROWS ---------------
    document.getElementById('rowUsername').addEventListener('click', () => openDialog('usernameDialog'));
    document.getElementById('rowEmail').addEventListener('click', () => openDialog('emailDialog'));
    document.getElementById('rowPassword').addEventListener('click', () => openDialog('passwordDialog'));

    // Username update
    document.getElementById('updateUsernameBtn').addEventListener('click', async () => {
        const newUsername = document.getElementById('newUsername').value.trim();
        if (!newUsername) return;
        try {
            await clerkUser.update({ username: newUsername });
            clerkUser = await window.Clerk.user;
            renderAll();
            closeDialog('usernameDialog');
            document.getElementById('newUsername').value = '';
        } catch (err) {
            document.getElementById('usernameError').textContent = err.message;
            document.getElementById('usernameError').classList.remove('hidden');
        }
    });

    // Email add
    document.getElementById('addEmailBtn').addEventListener('click', async () => {
        const email = document.getElementById('newEmail').value.trim();
        if (!email) return;
        try {
            const emailObj = await clerkUser.createEmailAddress({ emailAddress: email });
            await emailObj.prepareVerification({ strategy: 'email_code' });
            alert('Verification email sent to ' + email);
            closeDialog('emailDialog');
            document.getElementById('newEmail').value = '';
        } catch (err) {
            document.getElementById('emailError').textContent = err.message;
            document.getElementById('emailError').classList.remove('hidden');
        }
    });

    // Password change
    document.getElementById('updatePasswordBtn').addEventListener('click', async () => {
        const current = document.getElementById('currentPassword').value;
        const newPw = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        if (newPw !== confirm) {
            document.getElementById('passwordError').textContent = 'Passwords do not match.';
            document.getElementById('passwordError').classList.remove('hidden');
            return;
        }
        try {
            await clerkUser.updatePassword({ currentPassword: current, newPassword: newPw });
            closeDialog('passwordDialog');
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
        } catch (err) {
            document.getElementById('passwordError').textContent = err.message;
            document.getElementById('passwordError').classList.remove('hidden');
        }
    });

    // --------------- BANNER & AVATAR ---------------
    document.getElementById('profileBanner').addEventListener('click', () => openDialog('bannerDialog'));
    document.getElementById('profileAvatar').addEventListener('click', () => openDialog('avatarDialog'));

    document.getElementById('uploadBannerBtn').addEventListener('click', async () => {
        const file = document.getElementById('bannerFileInput').files[0];
        if (!file) return;
        const path = `${clerkUser.id}/banner_${Date.now()}`;
        const { error } = await window.supabaseClient.storage.from(BANNER_BUCKET).upload(path, file, { upsert: true });
        if (error) return alert('Upload failed: ' + error.message);
        const { data: publicUrlData } = window.supabaseClient.storage.from(BANNER_BUCKET).getPublicUrl(path);
        const newBannerUrl = publicUrlData.publicUrl;
        const { error: updateError } = await window.supabaseClient
            .from('profiles')
            .update({ banner_url: newBannerUrl })
            .eq('id', clerkUser.id);
        if (!updateError) {
            supabaseProfile.banner_url = newBannerUrl;
            renderAll();
            closeDialog('bannerDialog');
        }
    });

    document.getElementById('uploadAvatarBtn').addEventListener('click', async () => {
        const file = document.getElementById('avatarFileInput').files[0];
        if (!file) return;
        try {
            await clerkUser.setProfileImage({ file });
            clerkUser = await window.Clerk.user;
            renderAll();
            closeDialog('avatarDialog');
        } catch (err) {
            alert('Avatar update failed: ' + err.message);
        }
    });

    // Sessions
    document.getElementById('rowSessions').addEventListener('click', () => {
        const card = document.getElementById('sessionsCard');
        card.style.display = 'block';
        document.getElementById('sessionList').innerHTML = `
            <div class="profile-field__value">Chrome on Windows · Active now</div>
            <div class="profile-field__value">Safari on iPhone · 2 hours ago</div>
        `;
    });

    // --------------- CLOSE DIALOGS ---------------
    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => {
            const dialog = btn.closest('.dialog-overlay');
            if (dialog) dialog.classList.add('hidden');
        });
    });
    document.querySelectorAll('.dialog-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.add('hidden'); });
    });

    // --------------- KICK OFF ---------------
    initialize();
</script>
</body>
</html>
