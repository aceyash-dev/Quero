<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 • Quero</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FAF8F2;
            --surface: #FFFFFF;
            --text: #23211D;
            --text-muted: #6F685E;
            --accent: #A8733A;
            --accent-hover: #B88348;
            --border-subtle: rgba(168, 115, 58, 0.10);
            --border-medium: rgba(168, 115, 58, 0.15);
            --shadow-card: 0 1px 3px rgba(35, 33, 29, 0.04), 0 12px 32px rgba(35, 33, 29, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Lexend', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
        }

        .card {
            width: min(580px, 100%);
            background: var(--surface);
            border: 1px solid var(--border-medium);
            border-radius: 30px;
            padding: 60px 42px;
            text-align: center;
            box-shadow: var(--shadow-card);
        }

        .logo {
            width: 82px;
            height: 82px;
            object-fit: contain;
            margin-bottom: 28px;
        }

        .error {
            font-family: "Playfair Display", serif;
            font-size: 92px;
            line-height: 1;
            color: var(--accent);
            margin-bottom: 18px;
            font-weight: 600;
        }

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 40px;
            font-weight: 600;
            margin-bottom: 18px;
            color: var(--text);
        }

        p {
            color: var(--text-muted);
            line-height: 1.8;
            max-width: 420px;
            margin: auto;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            margin-top: 40px;
            padding: 14px 28px;
            background: var(--accent);
            color: #FFFFFF;
            border-radius: 999px;
            font-weight: 600;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 14px rgba(168, 115, 58, 0.30);
            border: none;
            cursor: pointer;
        }

        .button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(168, 115, 58, 0.38);
        }

        .footer {
            margin-top: 36px;
            color: var(--text-muted);
            font-size: 0.82rem;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="icon.svg" class="logo" alt="Quero">
        <div class="error">404</div>
        <h1>Page not found.</h1>
        <p>
            Quero searched everywhere but couldn't find the page you requested.
            The address may be incorrect, the page may have been moved,
            or it no longer exists.
        </p>
        <a class="button" href="/">Return Home</a>
        <div class="footer">© 2026 | The Ace Base</div>
    </div>
</body>
</html>
