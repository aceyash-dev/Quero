<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="Canvas">

  <meta
    name="description"
    content="Quero — a quiet AI workspace for thinking, creating, and getting things done."
  >

  <title>Quero</title>

  <link rel="icon" href="quero.png">

  <!-- Reicon -->
  <script src="https://unpkg.com/reicon/cdn/reicon.js"></script>

  <style>
    @font-face {
      font-family: "Outfit";
      src:
        url("https://fonts.ace-base.indevs.in/fonts/Outfit-Variable.ttf")
        format("truetype");
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    :root {
      color-scheme: light dark;

      --bg: #ffffff;
      --surface: #f7f7f5;
      --surface-2: #eeeeec;

      --text: #101010;
      --text-soft: #555753;
      --text-muted: #858782;

      --border: rgba(16, 16, 16, .10);
      --border-strong: rgba(16, 16, 16, .16);

      --accent: #101010;
      --accent-contrast: #ffffff;

      --nav-bg: rgba(255, 255, 255, .78);
      --card-bg: rgba(247, 247, 245, .82);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --ui: "Outfit", system-ui, sans-serif;

      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #080808;
        --surface: #101110;
        --surface-2: #171817;

        --text: #f3f3ef;
        --text-soft: #b7b9b4;
        --text-muted: #777a75;

        --border: rgba(243, 243, 239, .10);
        --border-strong: rgba(243, 243, 239, .17);

        --accent: #f3f3ef;
        --accent-contrast: #080808;

        --nav-bg: rgba(8, 8, 8, .78);
        --card-bg: rgba(16, 17, 16, .82);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      color-scheme: light dark;
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      width: 100%;
      min-width: 320px;
      min-height: 100svh;
      margin: 0;

      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% -10%,
          color-mix(in srgb, var(--text) 5%, transparent),
          transparent 38%
        ),
        var(--bg);

      color: var(--text);

      font-family: var(--ui);
      line-height: 1.5;

      user-select: none;
      -webkit-user-select: none;
    }

    button,
    a,
    input,
    textarea {
      -webkit-tap-highlight-color: transparent;
    }

    button,
    a {
      user-select: none;
      -webkit-user-select: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    re-icon {
      display: inline-flex;
      flex: 0 0 auto;
    }

    /* =====================================================
       APP
       ===================================================== */

    .app {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* =====================================================
       TOP BAR
       ===================================================== */

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;

      padding:
        max(12px, env(safe-area-inset-top))
        max(14px, env(safe-area-inset-right))
        12px
        max(14px, env(safe-area-inset-left));

      pointer-events: none;
    }

    .topbar-inner {
      width: min(1100px, 100%);
      min-height: 54px;

      margin: 0 auto;
      padding: 6px;

      display: flex;
      align-items: center;
      gap: 6px;

      background: var(--nav-bg);
      border: 1px solid var(--border);

      border-radius: var(--radius-xl);

      box-shadow:
        0 16px 50px color-mix(
          in srgb,
          var(--text) 8%,
          transparent
        );

      backdrop-filter: blur(20px) saturate(1.15);
      -webkit-backdrop-filter: blur(20px) saturate(1.15);

      pointer-events: auto;
    }

    .brand {
      min-width: 0;

      display: inline-flex;
      align-items: center;
      gap: 9px;

      padding: 4px 8px;

      color: var(--text);
      text-decoration: none;

      border-radius: var(--radius-md);
    }

    .brand-mark {
      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface-2);
    }

    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .brand-name {
      font-size: .92rem;
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .topbar-spacer {
      flex: 1;
    }

    .top-action {
      width: 40px;
      height: 40px;

      display: grid;
      place-items: center;

      padding: 0;

      color: var(--text-soft);
      background: transparent;

      border: 0;
      border-radius: 12px;

      cursor: pointer;

      transition:
        color .2s ease,
        background .2s ease,
        transform .25s var(--ease);
    }

    .top-action:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .top-action:active {
      transform: scale(.94);
    }

    /* =====================================================
       MAIN
       ===================================================== */

    main {
      width: 100%;
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        110px
        max(20px, env(safe-area-inset-right))
        110px
        max(20px, env(safe-area-inset-left));
    }

    .workspace {
      width: min(720px, 100%);
      margin: auto;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    /* =====================================================
       STATUS
       ===================================================== */

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 24px;
      padding: 7px 11px;

      color: var(--text-soft);

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 999px;

      font-size: .72rem;
      font-weight: 550;
      letter-spacing: .01em;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: currentColor;
      opacity: .65;
    }

    /* =====================================================
       HERO
       ===================================================== */

    .hero-icon {
      width: 68px;
      height: 68px;

      display: grid;
      place-items: center;

      margin-bottom: 26px;

      color: var(--text);

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 22px;

      box-shadow:
        0 18px 60px color-mix(
          in srgb,
          var(--text) 7%,
          transparent
        );
    }

    .hero-icon re-icon {
      opacity: .9;
    }

    .title {
      margin: 0;

      color: var(--text);

      font-size: clamp(
        3rem,
        10vw,
        6.5rem
      );

      line-height: .9;
      letter-spacing: -.075em;
      font-weight: 560;
    }

    .title span {
      color: var(--text-muted);
    }

    .description {
      max-width: 520px;

      margin: 25px auto 0;

      color: var(--text-soft);

      font-size: clamp(
        .95rem,
        2vw,
        1.05rem
      );

      line-height: 1.75;
    }

    /* =====================================================
       INCOMPLETE APP CARD
       ===================================================== */

    .composer-shell {
      width: min(620px, 100%);

      margin-top: 42px;

      padding: 8px;

      background: var(--card-bg);

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      box-shadow:
        0 24px 80px color-mix(
          in srgb,
          var(--text) 7%,
          transparent
        );

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .composer {
      min-height: 72px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 8px 9px 8px 18px;

      background: var(--surface);
      border: 1px solid var(--border);

      border-radius: 15px;
    }

    .composer-placeholder {
      min-width: 0;
      flex: 1;

      text-align: left;

      color: var(--text-muted);

      font-size: .88rem;
    }

    .composer-button {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      flex: 0 0 auto;

      color: var(--accent-contrast);
      background: var(--accent);

      border: 0;
      border-radius: 13px;

      cursor: pointer;

      transition:
        transform .25s var(--ease),
        opacity .2s ease;
    }

    .composer-button:hover {
      transform: translateY(-1px);
    }

    .composer-button:active {
      transform: scale(.94);
    }

    .composer-note {
      margin-top: 10px;

      color: var(--text-muted);

      font-size: .65rem;
      letter-spacing: .01em;
    }

    /* =====================================================
       FOOTER
       ===================================================== */

    footer {
      width: 100%;

      padding:
        20px
        max(20px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));

      color: var(--text-muted);

      text-align: center;
      font-size: .65rem;
    }

    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {
      .topbar {
        padding-top: max(
          8px,
          env(safe-area-inset-top)
        );
      }

      .topbar-inner {
        min-height: 52px;
      }

      .brand-name {
        display: none;
      }

      main {
        padding-top: 100px;
        padding-bottom: 80px;
      }

      .hero-icon {
        width: 60px;
        height: 60px;
        border-radius: 19px;
      }

      .title {
        font-size: clamp(
          3.4rem,
          18vw,
          5.5rem
        );
      }

      .description {
        max-width: 360px;
      }

      .composer-shell {
        margin-top: 34px;
      }

      .composer {
        min-height: 64px;
        padding-left: 14px;
      }

      .composer-placeholder {
        font-size: .82rem;
      }

      .composer-button {
        width: 40px;
        height: 40px;
      }
    }

    @media (max-width: 360px) {
      main {
        padding-inline: 14px;
      }

      .description {
        font-size: .9rem;
      }

      .composer-placeholder {
        font-size: .76rem;
      }
    }

    @media (min-width: 1200px) {
      main {
        padding-top: 130px;
      }
    }

    /* =====================================================
       REDUCED MOTION
       ===================================================== */

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ===================================================
         TOP BAR
         =================================================== -->

    <header class="topbar">
      <div class="topbar-inner">

        <a
          class="brand"
          href="/"
          aria-label="Quero home"
        >
          <span class="brand-mark">
            <img
              src="quero.png"
              alt=""
              width="32"
              height="32"
            >
          </span>

          <span class="brand-name">
            Quero
          </span>
        </a>

        <div class="topbar-spacer"></div>

        <button
          class="top-action"
          type="button"
          aria-label="Settings"
          disabled
        >
          <re-icon
            icon="settings"
            size="19"
            weight="Outline"
          ></re-icon>
        </button>

      </div>
    </header>


    <!-- ===================================================
         MAIN WORKSPACE
         =================================================== -->

    <main>
      <section
        class="workspace"
        aria-labelledby="page-title"
      >

        <div class="status">
          <span
            class="status-dot"
            aria-hidden="true"
          ></span>

          In development
        </div>


        <div
          class="hero-icon"
          aria-hidden="true"
        >
          <re-icon
            icon="sparkles"
            size="30"
            weight="Outline"
          ></re-icon>
        </div>


        <h1
          class="title"
          id="page-title"
        >
          Quero<span>.</span>
        </h1>


        <p class="description">
          A quiet AI workspace for thinking,
          creating, and getting things done.
          The app is still being built.
        </p>


        <!-- Incomplete composer preview -->
        <div class="composer-shell">

          <div class="composer">

            <div class="composer-placeholder">
              Ask Quero anything...
            </div>

            <button
              class="composer-button"
              type="button"
              aria-label="Send message"
              disabled
            >
              <re-icon
                icon="arrow-up"
                size="19"
                weight="Outline"
              ></re-icon>
            </button>

          </div>

          <div class="composer-note">
            Composer coming soon
          </div>

        </div>

      </section>
    </main>


    <!-- ===================================================
         FOOTER
         =================================================== -->

    <footer>
      Quero · © 2026 The Ace Base
    </footer>

  </div>

</body>
</html>
